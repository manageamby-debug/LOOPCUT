services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loopcut}
      POSTGRES_USER: ${POSTGRES_USER:-loopcut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loopcut-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loopcut} -d ${POSTGRES_DB:-loopcut}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-loopcut-dev}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-loopcut-dev-secret}
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./frontend-prototype:/usr/share/nginx/html:ro

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy

volumes:
  postgres_data:
  rustfs_data:
